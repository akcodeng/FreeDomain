<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Availability - DigitalPlat FreeDomain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-4 py-12">
  <div class="w-full max-w-lg space-y-6">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 text-center space-y-5">
      <div>
        <p class="text-xs uppercase tracking-widest text-slate-400">Check availability</p>
        <h1 class="text-2xl font-semibold text-slate-900 mt-1">Domain Availability</h1>
      </div>

      <div class="rounded-xl bg-emerald-50 border border-emerald-200 px-4 py-3 text-sm text-emerald-700">
        {{regtips}}
      </div>

      <div class="text-left space-y-3">
        <h2 class="text-lg font-semibold text-slate-900">Domain information</h2>
        <dl class="space-y-2 text-sm">
          <div>
            <dt class="text-slate-400 uppercase tracking-wide text-xs">Domain name</dt>
            <dd class="text-slate-900 font-semibold text-base">{{domain_name}}.us.kg</dd>
          </div>
          <div>
            <dt class="text-slate-400 uppercase tracking-wide text-xs">Price</dt>
            <dd class="text-slate-700">Always free. Renewal available when under 180 days until expiry.</dd>
          </div>
        </dl>
      </div>

      <p class="text-sm text-slate-600">Sign up for a new account now! It only takes five minutes and it is always free.</p>
    </div>

    <footer class="text-center text-xs text-slate-400">
      <p>Imoogle Technology</p>
    </footer>
  </div>

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
